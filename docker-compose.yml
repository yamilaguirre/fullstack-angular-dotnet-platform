services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: evalua-sqlserver
    # Required on Apple Silicon if the emulator path is flaky; harmless on amd64.
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Evalua_Dev_2026!}"
    ports:
      - "1433:1433"
    volumes:
      - evalua_sql_data:/var/opt/mssql

volumes:
  evalua_sql_data:
